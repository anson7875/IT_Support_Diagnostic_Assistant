<!DOCTYPE html>
<html lang="{{ 'zh-Hant' if lang == 'zh' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.app_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="{{ url_for('main.index') }}">
        <span class="brand-badge">IT</span>
        <div>
          <div class="brand-title">{{ t.app_title }}</div>
          <div class="brand-sub">{{ t.app_subtitle }}</div>
        </div>
      </a>
      <nav class="nav-actions">
        <a class="btn btn-ghost" href="{{ url_for('main.index') }}">{{ t.nav_home }}</a>
        <a class="btn btn-outline" href="{{ url_for('main.set_language', lang_code=t.lang_switch_code) }}">
          🌐 {{ t.lang_switch_label }}
        </a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
